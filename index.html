<!DOCTYPE html>
<html>

<head>

    <title>PATIENT REGISTRATION FORM</title>

    <style>

        body {
            background-color: blue;
            font-size: 15px;
            text-align: center;
            margin: 30px;
        }

        h1 {
            color: blue;
        }

    </style>

</head>

<body>

    <h1>PATIENT REGISTRATION FORM</h1>

    <form>

        <table border="1" cellpadding="8">

            <tr>
                <td><label>Patient Name:</label></td>
                <td><input type="text" name="patient_name"></td>
            </tr>

            <tr>
                <td><label>Age:</label></td>
                <td><input type="number" name="age"></td>
            </tr>

            <tr>
                <td><label>Date of Birth:</label></td>
                <td><input type="date" name="date_of_birth"></td>
            </tr>

            <tr>
                <td><label>Gender:</label></td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>

            <tr>
                <td><label>ID Number:</label></td>
                <td><input type="text" name="id_number"></td>
            </tr>

            <tr>
                <td><label>Patient ID:</label></td>
                <td><input type="text" name="patient_id"></td>
            </tr>

            <tr>
                <td><label>Phone Number:</label></td>
                <td><input type="tel" name="phone_number"></td>
            </tr>

            <tr>
                <td><label>Health Status Disability:</label></td>
                <td>
                    <input type="radio" name="health_status_disability" value="Yes"> Yes
                    <input type="radio" name="health_status_disability" value="No"> No
                </td>
            </tr>

            <tr>
                <td><label>Address:</label></td>
                <td><input type="text" name="address"></td>
            </tr>

            <tr>
                <td><label>Marital Status:</label></td>
                <td>
                    <input type="radio" name="marital_status" value="single"> Single
                    <input type="radio" name="marital_status" value="married"> Married
                </td>
            </tr>

            <tr>
                <td><label>Next of Kin:</label></td>
                <td><input type="text" name="next_of_kin"></td>
            </tr>

            <tr>
                <td><label>Weight:</label></td>
                <td><input type="number" name="weight"></td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Register Patient">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
